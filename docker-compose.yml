version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: legal_rag_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: legalrag
      POSTGRES_DB: legalrag
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legalrag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  qdrant_storage:
  postgres_data:
